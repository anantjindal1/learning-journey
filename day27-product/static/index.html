<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProductivityAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --sidebar: #1e293b;
      --card: #334155;
      --card-hover: #475569;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --border: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .logo {
      padding: 1.25rem 1.5rem;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
      border-bottom: 1px solid var(--border);
    }

    .mode-buttons {
      padding: 1rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .mode-btn {
      padding: 0.75rem 1rem;
      border: none;
      border-radius: 0.5rem;
      background: transparent;
      color: var(--text-muted);
      font: inherit;
      font-size: 0.9rem;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
    }

    .mode-btn:hover {
      background: var(--card);
      color: var(--text);
    }

    .mode-btn.active {
      background: var(--accent);
      color: white;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 0.5rem 1rem;
    }

    .notes-section {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem;
    }

    .notes-section h3 {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
      padding: 0 0.5rem;
    }

    .note-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.75rem;
      border-radius: 0.5rem;
      margin-bottom: 0.25rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .note-item:hover {
      background: var(--card);
    }

    .note-item.done .note-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .note-checkbox {
      width: 1rem;
      height: 1rem;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }

    .note-priority {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .note-priority.high { background: var(--danger); }
    .note-priority.normal { background: var(--warning); }
    .note-priority.low { background: var(--success); }

    .note-title {
      flex: 1;
      font-size: 0.875rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .add-note-form {
      padding: 0.75rem;
      border-top: 1px solid var(--border);
    }

    .add-note-form input,
    .add-note-form textarea,
    .add-note-form select {
      width: 100%;
      padding: 0.5rem 0.75rem;
      margin-bottom: 0.5rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      background: var(--bg);
      color: var(--text);
      font: inherit;
      font-size: 0.875rem;
    }

    .add-note-form input::placeholder,
    .add-note-form textarea::placeholder {
      color: var(--text-muted);
    }

    .add-note-form textarea {
      resize: none;
      min-height: 60px;
    }

    .add-note-form button {
      width: 100%;
      padding: 0.5rem;
      border: none;
      border-radius: 0.5rem;
      background: var(--accent);
      color: white;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .add-note-form button:hover {
      background: var(--accent-hover);
    }

    .stats-bar {
      padding: 0.75rem 1rem;
      background: var(--bg);
      border-top: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      gap: 1rem;
    }

    .stats-bar span {
      color: var(--text);
      font-weight: 600;
    }

    /* Main content */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel {
      display: none;
      flex: 1;
      flex-direction: column;
      overflow: hidden;
    }

    .panel.active {
      display: flex;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message {
      max-width: 85%;
      padding: 1rem 1.25rem;
      border-radius: 1rem;
      font-size: 0.95rem;
      line-height: 1.5;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      background: var(--accent);
      color: white;
    }

    .message.assistant {
      align-self: flex-start;
      background: var(--card);
      border: 1px solid var(--border);
    }

    .typing-indicator {
      display: flex;
      gap: 1rem;
      padding: 1rem 1.25rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      align-self: flex-start;
      width: fit-content;
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: typing 1.4s infinite ease-in-out;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing {
      0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
      40% { transform: scale(1.2); opacity: 1; }
    }

    .sources-section {
      margin-top: 1rem;
      padding: 1rem;
      border-top: 1px solid var(--border);
    }

    .sources-section h4 {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }

    .sources-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .source-card {
      padding: 0.5rem 0.75rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text);
    }

    .tools-used {
      margin-top: 0.75rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .tool-pill {
      padding: 0.25rem 0.5rem;
      border-radius: 0.25rem;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .tool-pill.create_note { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
    .tool-pill.delete_note { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
    .tool-pill.update_note { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }
    .tool-pill.get_notes { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
    .tool-pill.search_notes { background: rgba(168, 85, 247, 0.2); color: #a855f7; }
    .tool-pill.get_stats { background: rgba(34, 197, 94, 0.2); color: #22c55e; }

    .input-area {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border);
      background: var(--sidebar);
    }

    .input-row {
      display: flex;
      gap: 0.75rem;
      align-items: flex-end;
    }

    .input-row textarea {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      background: var(--bg);
      color: var(--text);
      font: inherit;
      font-size: 0.95rem;
      resize: none;
      min-height: 44px;
      max-height: 120px;
      transition: border-color 0.2s ease;
    }

    .input-row textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .input-row textarea::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      padding: 0.75rem 1.25rem;
      border: none;
      border-radius: 0.75rem;
      background: var(--accent);
      color: white;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
      flex-shrink: 0;
    }

    .send-btn:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .clear-btn {
      padding: 0.5rem 0.75rem;
      margin-top: 0.5rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      background: transparent;
      color: var(--text-muted);
      font: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .clear-btn:hover {
      background: var(--card);
      color: var(--text);
    }

    .placeholder {
      padding: 1.5rem;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 0.25rem;
    }

    .example-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      padding: 0 1.5rem 1rem;
    }

    .chip {
      padding: 0.4rem 0.75rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chip:hover {
      background: var(--card-hover);
      color: var(--text);
      border-color: var(--accent);
    }

    .actions-badge {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">⚡ ProductivityAI</div>

      <div class="mode-buttons">
        <button class="mode-btn active" data-mode="chat">🤖 Chat</button>
        <button class="mode-btn" data-mode="research">🔍 Research</button>
        <button class="mode-btn" data-mode="agent">⚙️ Agent</button>
      </div>

      <div class="divider"></div>

      <div class="notes-section">
        <h3>Your Notes</h3>
        <div id="notes-list"></div>

        <div class="add-note-form">
          <input type="text" id="new-note-title" placeholder="Title">
          <textarea id="new-note-content" placeholder="Content"></textarea>
          <select id="new-note-priority">
            <option value="low">Low</option>
            <option value="normal" selected>Normal</option>
            <option value="high">High</option>
          </select>
          <button type="button" id="add-note-btn">Add Note</button>
        </div>
      </div>

      <div class="stats-bar">
        <span>Total: <span id="stat-total">0</span></span>
        <span>Done: <span id="stat-done">0</span></span>
        <span>Pending: <span id="stat-pending">0</span></span>
      </div>
    </aside>

    <main class="main">
      <!-- Chat Panel -->
      <div class="panel active" id="panel-chat">
        <div class="messages" id="chat-messages"></div>
        <div class="input-area">
          <div class="input-row">
            <textarea id="chat-input" placeholder="Ask anything..." rows="1"></textarea>
            <button class="send-btn" id="chat-send">Send</button>
          </div>
          <button class="clear-btn" id="chat-clear">Clear conversation</button>
        </div>
      </div>

      <!-- Research Panel -->
      <div class="panel" id="panel-research">
        <div class="placeholder">Ask anything about company policies...</div>
        <div class="example-chips">
          <span class="chip" data-query="What's the expense policy?">What's the expense policy?</span>
          <span class="chip" data-query="How does hiring work?">How does hiring work?</span>
          <span class="chip" data-query="What are the meeting guidelines?">What are the meeting guidelines?</span>
        </div>
        <div class="messages" id="research-messages"></div>
        <div class="input-area">
          <div class="input-row">
            <textarea id="research-input" placeholder="Ask about company policies..." rows="1"></textarea>
            <button class="send-btn" id="research-send">Send</button>
          </div>
          <button class="clear-btn" id="research-clear">Clear conversation</button>
        </div>
      </div>

      <!-- Agent Panel -->
      <div class="panel" id="panel-agent">
        <div class="placeholder">Tell me to create, find, update or delete notes...</div>
        <div class="example-chips">
          <span class="chip" data-query="Add a high priority note about the investor meeting next week">Add a high priority note about the investor meeting next week</span>
        </div>
        <div class="messages" id="agent-messages"></div>
        <div class="input-area">
          <div class="input-row">
            <textarea id="agent-input" placeholder="Tell the agent what to do..." rows="1"></textarea>
            <button class="send-btn" id="agent-send">Send</button>
          </div>
          <button class="clear-btn" id="agent-clear">Clear conversation</button>
        </div>
      </div>
    </main>
  </div>

  <script>
    const API = window.location.origin;

    // State
    let activeMode = 'chat';
    const chatHistory = [];
    const researchHistory = [];
    let agentHistory = [];

    // DOM
    const modeBtns = document.querySelectorAll('.mode-btn');
    const panels = document.querySelectorAll('.panel');
    const notesList = document.getElementById('notes-list');
    const statTotal = document.getElementById('stat-total');
    const statDone = document.getElementById('stat-done');
    const statPending = document.getElementById('stat-pending');

    // Mode switching
    modeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const mode = btn.dataset.mode;
        activeMode = mode;
        modeBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        panels.forEach(p => p.classList.remove('active'));
        document.getElementById(`panel-${mode}`).classList.add('active');
      });
    });

    // Refresh notes
    async function refreshNotes() {
      try {
        const res = await fetch(`${API}/api/notes`);
        const notes = await res.json();
        notesList.innerHTML = notes.map(n => `
          <div class="note-item ${n.done ? 'done' : ''}" data-id="${n.id}">
            <input type="checkbox" class="note-checkbox" ${n.done ? 'checked' : ''} data-id="${n.id}">
            <span class="note-priority ${n.priority}"></span>
            <span class="note-title">${escapeHtml(n.title)}</span>
          </div>
        `).join('');

        notesList.querySelectorAll('.note-checkbox').forEach(cb => {
          cb.addEventListener('change', async (e) => {
            e.stopPropagation();
            const id = parseInt(cb.dataset.id);
            await fetch(`${API}/api/notes/${id}/done`, { method: 'PATCH' });
            refreshNotes();
            refreshStats();
          });
        });
      } catch (err) {
        console.error('Failed to fetch notes:', err);
      }
    }

    function escapeHtml(s) {
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    // Refresh stats
    async function refreshStats() {
      try {
        const res = await fetch(`${API}/api/stats`);
        const s = await res.json();
        statTotal.textContent = s.total;
        statDone.textContent = s.done;
        statPending.textContent = s.pending;
      } catch (err) {
        console.error('Failed to fetch stats:', err);
      }
    }

    // Add note
    document.getElementById('add-note-btn').addEventListener('click', async () => {
      const title = document.getElementById('new-note-title').value.trim();
      const content = document.getElementById('new-note-content').value.trim();
      const priority = document.getElementById('new-note-priority').value;
      if (!title || !content) return;
      try {
        await fetch(`${API}/api/notes`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, content, priority }),
        });
        document.getElementById('new-note-title').value = '';
        document.getElementById('new-note-content').value = '';
        refreshNotes();
        refreshStats();
      } catch (err) {
        console.error('Failed to add note:', err);
      }
    });

    // Chat send (streaming)
    async function sendChatMessage() {
      const input = document.getElementById('chat-input');
      const msg = input.value.trim();
      if (!msg) return;

      const messagesEl = document.getElementById('chat-messages');
      messagesEl.innerHTML += `<div class="message user">${escapeHtml(msg)}</div>`;
      input.value = '';
      chatHistory.push({ role: 'user', content: msg });

      const typingEl = document.createElement('div');
      typingEl.className = 'typing-indicator';
      typingEl.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
      messagesEl.appendChild(typingEl);
      messagesEl.scrollTop = messagesEl.scrollHeight;

      try {
        const res = await fetch(`${API}/api/chat/stream`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: msg, history: chatHistory.slice(0, -1), mode: 'chat' }),
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let fullText = '';

        typingEl.remove();
        const assistantEl = document.createElement('div');
        assistantEl.className = 'message assistant';
        assistantEl.textContent = '';
        messagesEl.appendChild(assistantEl);

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              try {
                const data = JSON.parse(line.slice(6));
                if (data.token) {
                  fullText += data.token;
                  assistantEl.textContent = fullText;
                  messagesEl.scrollTop = messagesEl.scrollHeight;
                }
              } catch (_) {}
            }
          }
        }

        chatHistory.push({ role: 'assistant', content: fullText });
      } catch (err) {
        typingEl.remove();
        messagesEl.innerHTML += `<div class="message assistant">Error: ${escapeHtml(err.message)}</div>`;
      }
    }

    document.getElementById('chat-send').addEventListener('click', sendChatMessage);
    document.getElementById('chat-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendChatMessage();
      }
    });

    document.getElementById('chat-clear').addEventListener('click', () => {
      chatHistory.length = 0;
      document.getElementById('chat-messages').innerHTML = '';
    });

    // Research send (streaming + sources)
    async function sendResearchMessage() {
      const input = document.getElementById('research-input');
      const msg = input.value.trim();
      if (!msg) return;

      const messagesEl = document.getElementById('research-messages');
      messagesEl.innerHTML += `<div class="message user">${escapeHtml(msg)}</div>`;
      input.value = '';
      researchHistory.push({ role: 'user', content: msg });

      const typingEl = document.createElement('div');
      typingEl.className = 'typing-indicator';
      typingEl.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
      messagesEl.appendChild(typingEl);
      messagesEl.scrollTop = messagesEl.scrollHeight;

      try {
        const res = await fetch(`${API}/api/chat/stream`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: msg, history: researchHistory.slice(0, -1), mode: 'research' }),
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let fullText = '';
        let sources = [];

        typingEl.remove();
        const assistantEl = document.createElement('div');
        assistantEl.className = 'message assistant';
        assistantEl.textContent = '';
        messagesEl.appendChild(assistantEl);

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              try {
                const data = JSON.parse(line.slice(6));
                if (data.token) {
                  fullText += data.token;
                  assistantEl.textContent = fullText;
                  messagesEl.scrollTop = messagesEl.scrollHeight;
                }
                if (data.sources) sources = data.sources;
              } catch (_) {}
            }
          }
        }

        researchHistory.push({ role: 'assistant', content: fullText });

        if (sources.length > 0) {
          const sourcesEl = document.createElement('div');
          sourcesEl.className = 'sources-section';
          sourcesEl.innerHTML = `
            <h4>Sources consulted:</h4>
            <div class="sources-row">
              ${sources.map(s => `<span class="source-card">${escapeHtml(s.title)}</span>`).join('')}
            </div>
          `;
          messagesEl.appendChild(sourcesEl);
        }
        messagesEl.scrollTop = messagesEl.scrollHeight;
      } catch (err) {
        typingEl.remove();
        messagesEl.innerHTML += `<div class="message assistant">Error: ${escapeHtml(err.message)}</div>`;
      }
    }

    document.getElementById('research-send').addEventListener('click', sendResearchMessage);
    document.getElementById('research-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendResearchMessage();
      }
    });

    document.getElementById('research-clear').addEventListener('click', () => {
      researchHistory.length = 0;
      document.getElementById('research-messages').innerHTML = '';
    });

    document.querySelectorAll('#panel-research .chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.getElementById('research-input').value = chip.dataset.query;
        sendResearchMessage();
      });
    });

    // Agent send (non-streaming)
    async function sendAgentMessage() {
      const input = document.getElementById('agent-input');
      const msg = input.value.trim();
      if (!msg) return;

      const messagesEl = document.getElementById('agent-messages');
      messagesEl.innerHTML += `<div class="message user">${escapeHtml(msg)}</div>`;
      input.value = '';

      const sendBtn = document.getElementById('agent-send');
      sendBtn.disabled = true;

      const typingEl = document.createElement('div');
      typingEl.className = 'typing-indicator';
      typingEl.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
      messagesEl.appendChild(typingEl);
      messagesEl.scrollTop = messagesEl.scrollHeight;

      try {
        const res = await fetch(`${API}/api/agent`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: msg, history: agentHistory }),
        });

        const data = await res.json();
        typingEl.remove();

        agentHistory = data.history || [];

        let toolsHtml = '';
        if (data.tools_used && data.tools_used.length > 0) {
          toolsHtml = `
            <div class="actions-badge">Actions taken:</div>
            <div class="tools-used">
              ${data.tools_used.map(t => `<span class="tool-pill ${t}">${t}</span>`).join('')}
            </div>
          `;
        }

        const assistantEl = document.createElement('div');
        assistantEl.className = 'message assistant';
        assistantEl.innerHTML = `
          ${toolsHtml}
          <div>${escapeHtml(data.response || '')}</div>
        `;
        messagesEl.appendChild(assistantEl);
        messagesEl.scrollTop = messagesEl.scrollHeight;

        refreshNotes();
        refreshStats();
      } catch (err) {
        typingEl.remove();
        messagesEl.innerHTML += `<div class="message assistant">Error: ${escapeHtml(err.message)}</div>`;
      } finally {
        sendBtn.disabled = false;
      }
    }

    document.getElementById('agent-send').addEventListener('click', sendAgentMessage);
    document.getElementById('agent-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendAgentMessage();
      }
    });

    document.getElementById('agent-clear').addEventListener('click', () => {
      agentHistory = [];
      document.getElementById('agent-messages').innerHTML = '';
    });

    document.querySelectorAll('#panel-agent .chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.getElementById('agent-input').value = chip.dataset.query;
        sendAgentMessage();
      });
    });

    // Init
    refreshNotes();
    refreshStats();
  </script>
</body>
</html>
